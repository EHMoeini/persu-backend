services:
  - type: web
    name: persu-backend
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_LOG_LEVEL
        value: INFO
